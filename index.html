<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AHM7D | الرئيسية</title>

  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="style.css">

  <style>
    /* تثبيت مكان الشعار أثناء التجميع */
    .hero .hero-content {
      animation: none !important;
    }

    /* إلغاء انتقال دخول الشعار الأصلي */
    .hero .hero-logo {
      animation: none !important;
      opacity: 1;
      transform: none;
    }

    body.logo-assembling .hero-logo {
      visibility: hidden;
    }

    /* خلفية شفافة حتى تظهر غرفة الموقع */
    #logo-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      background: transparent;
      pointer-events: none;
      overflow: hidden;
    }

    #logo-intro.is-active {
      display: block;
      animation: none !important;
      opacity: 1;
      visibility: visible;
    }

    #logo-intro .intro-pieces {
      position: fixed;
      margin: 0;
      padding: 0;
      aspect-ratio: auto;
      filter: none;
    }

    #logo-intro .intro-piece {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      border: 0;
      animation: home-logo-assemble 3s
        cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes home-logo-assemble {
      from {
        opacity: 0;
        transform:
          translate(var(--start-x), var(--start-y))
          rotate(var(--start-rotation))
          scale(0.6);
      }

      15% {
        opacity: 1;
      }

      to {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #logo-intro {
        display: none !important;
      }

      body.logo-assembling .hero-logo {
        visibility: visible;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <nav class="site-nav" aria-label="التنقل الرئيسي">
      <a href="index.html" aria-current="page">الرئيسية</a>
      <a href="work.html">مهاراتي</a>
      <a href="about.html">نبذة عني</a>
      <a href="contact.html">تواصل</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">

      <div class="background-name" aria-hidden="true" dir="ltr">
        AHM7D
      </div>

      <div class="hero-content">
        <h1 lang="en" dir="ltr">CONTENT CREATOR</h1>

        <span class="small-line" aria-hidden="true"></span>

        <img
          class="hero-logo"
          src="./شعار.png"
          alt="شعار أحمد"
        >

        <a class="about-button" href="about.html">
          تعرّف علي
          <span aria-hidden="true">←</span>
        </a>
      </div>

    </section>
  </main>

  <div class="logo-intro" id="logo-intro" aria-hidden="true">
    <div class="intro-pieces"></div>
  </div>

  <script>
    (() => {
      const intro = document.getElementById("logo-intro");
      const pieces = intro.querySelector(".intro-pieces");
      const mainLogo = document.querySelector(".hero-logo");

      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      if (reducedMotion) {
        intro.remove();
        return;
      }

      document.body.classList.add("logo-assembling");

      let finished = false;

      function finishIntro() {
        if (finished) return;
        finished = true;

        document.body.classList.remove("logo-assembling");
        intro.remove();

        window.removeEventListener("resize", finishIntro);
        window.removeEventListener("scroll", finishIntro);
      }

      /* إظهار الشعار إذا تأخر تحميل الصورة */
      const safetyTimer = setTimeout(finishIntro, 6000);

      async function startIntro() {
        try {
          await mainLogo.decode();

          if (finished) return;

          const rect = mainLogo.getBoundingClientRect();
          const appearance = getComputedStyle(mainLogo);

          if (!rect.width || !rect.height) {
            finishIntro();
            return;
          }

          /* مطابقة مكان وحجم الشعار الحقيقي */
          pieces.style.left = rect.left + "px";
          pieces.style.top = rect.top + "px";
          pieces.style.width = rect.width + "px";
          pieces.style.height = rect.height + "px";

          const images = [];

          /* تقسيم الشعار إلى 16 قطعة */
          for (let row = 0; row < 4; row++) {
            for (let column = 0; column < 4; column++) {
              const piece = document.createElement("img");

              piece.src = mainLogo.currentSrc || mainLogo.src;
              piece.alt = "";
              piece.className = "intro-piece";

              piece.style.clipPath = `inset(
                ${row * 25}%
                ${(3 - column) * 25}%
                ${(3 - row) * 25}%
                ${column * 25}%
              )`;

              piece.style.setProperty(
                "--start-x",
                `${(column - 1.5) * 95}px`
              );

              piece.style.setProperty(
                "--start-y",
                `${(row - 1.5) * 95}px`
              );

              piece.style.setProperty(
                "--start-rotation",
                `${(row + column) % 2 === 0 ? 30 : -30}deg`
              );

              piece.style.filter = appearance.filter;
              piece.style.objectFit = appearance.objectFit;
              piece.style.objectPosition = appearance.objectPosition;

              pieces.appendChild(piece);
              images.push(piece);
            }
          }

          await Promise.all(images.map(image => image.decode()));

          if (finished) return;

          clearTimeout(safetyTimer);

          pieces.lastElementChild.addEventListener(
            "animationend",
            finishIntro,
            { once: true }
          );

          intro.classList.add("is-active");

          window.addEventListener("resize", finishIntro, { once: true });
          window.addEventListener("scroll", finishIntro, { once: true });

          setTimeout(finishIntro, 3300);
        } catch {
          finishIntro();
        }
      }

      requestAnimationFrame(startIntro);
    })();
  </script>

  <script src="./effects.js"></script>
<script src="./effects.js"></script>
<script src="./director.js"></script>
</body>
</html>
