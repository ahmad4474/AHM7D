  <script>
  const cards = document.querySelectorAll(".skill-card");

  cards.forEach((card) => {
    card.addEventListener("toggle", () => {
      if (card.open) {
        cards.forEach((otherCard) => {
          if (otherCard !== card) {
            otherCard.open = false;
          }
        });
      }
    });
  });
</script>
<script>
  // تحديد بطاقة المونتاج
  const editingCard = Array.from(
    document.querySelectorAll(".skill-card")
  ).find(card =>
    card.querySelector("h2")?.textContent.trim() === "المونتاج"
  );

  if (editingCard) {
    const websites = {
      "Adobe Premiere Pro": "https://www.adobe.com/products/premiere.html",
      "CapCut": "https://www.capcut.com/"
    };

    editingCard.querySelectorAll(".skill-app").forEach(app => {
      const name = app.textContent.replace("↗", "").trim();
      const website = websites[name];

      if (!website) return;

      const link = document.createElement("a");

      link.className = app.className;
      link.innerHTML = app.innerHTML;
      link.href = website;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.lang = "en";
      link.dir = "ltr";
      link.title = "فتح موقع " + name;

      app.replaceWith(link);
    });
  }
</script>
